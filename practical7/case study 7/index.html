<!DOCTYPE html>
<html>
<head>
    <title>Smart To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>✨ Smart To-Do List</h1>
    <p>Organize your tasks and stay productive.</p>

    <div class="input-box">
        <select id="category">
            <option>📚 Study</option>
            <option>💼 Work</option>
            <option>🏠 Personal</option>
        </select>

        <input id="taskInput" placeholder="What needs to be done?">

        <select id="priority">
            <option>🟡 Medium</option>
            <option>🔴 High</option>
            <option>🟢 Low</option>
        </select>

        <button id="addBtn">＋ Add</button>
    </div>

    <div class="stats">
        <div><b id="total">0</b><small>Total Tasks</small></div>
        <div><b id="completed">0</b><small>Completed</small></div>
        <div><b id="pending">0</b><small>Pending</small></div>
        <div><b id="high">0</b><small>High Priority</small></div>
    </div>

    <ul id="taskList"></ul>

    <div id="empty">🌸 No tasks yet<br>
        <small>Add a task to get started!</small>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>

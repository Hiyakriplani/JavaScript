<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitZone Gym Admission</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Left Section -->
        <div class="welcome">
            <div class="logo">FIT<span>ZONE</span></div>

            <h1>Build Your<br>Best Self.</h1>

            <p>
                Start your fitness journey today.
                Join FitZone and become a stronger,
                healthier version of yourself.
            </p>

            <div class="features">
                <div>🏋️ Modern Equipment</div>
                <div>🔥 Personalized Workouts</div>
                <div>💪 Expert Trainers</div>
                <div>⚡ Flexible Memberships</div>
            </div>
        </div>

        <!-- Form Section -->
        <div class="form-section">

            <h2>Gym Admission</h2>
            <p class="subtitle">Fill in your details to get started.</p>

            <form id="gymForm">

                <!-- Full Name -->
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name">
                    <small id="nameError"></small>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="example@email.com">
                    <small id="emailError"></small>
                </div>

                <!-- Phone -->
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="10-digit mobile number">
                    <small id="phoneError"></small>
                </div>

                <!-- Age -->
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" placeholder="Enter your age">
                    <small id="ageError"></small>
                </div>

                <!-- Gender -->
                <div class="form-group">
                    <label>Gender</label>

                    <div class="radio-group">
                        <label>
                            <input type="radio" name="gender" value="Male">
                            Male
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Female">
                            Female
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Other">
                            Other
                        </label>
                    </div>

                    <small id="genderError"></small>
                </div>

                <!-- Membership -->
                <div class="form-group">
                    <label for="plan">Membership Plan</label>

                    <select id="plan">
                        <option value="">Select a plan</option>
                        <option value="Monthly">Monthly - ₹999</option>
                        <option value="Quarterly">Quarterly - ₹2499</option>
                        <option value="Yearly">Yearly - ₹7999</option>
                    </select>

                    <small id="planError"></small>
                </div>

                <!-- Terms -->
                <div class="terms">
                    <input type="checkbox" id="terms">
                    <label for="terms">
                        I agree to the gym rules and membership terms.
                    </label>
                </div>

                <small id="termsError"></small>

                <button type="submit">Join FitZone →</button>

                <div id="successMessage"></div>

            </form>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>

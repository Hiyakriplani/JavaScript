<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let marks = [10, 20, 30, 40, 50];
        let newMarks = marks.map(function(mark){
            return mark * 2;
        });
        document.write("Original Marks: " + marks + "<br>");
        document.write("New Marks: " + newMarks);
    </script>
</body>
</html>

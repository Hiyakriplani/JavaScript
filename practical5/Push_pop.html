<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Movie Playlist</h2>
    <script>
        let movies = ["Avengers","Inception"];
        document.write("Original Movies: " + movies +"<br><br>");
        
        movies.push("Titanic");
        document.write("After adding Movie: " + movies +"<br>");

        movies.pop();
        document.write("After removing Movie: " + movies +"<br>");

        document.write("Total Movies: " + movies.length); 
    </script>
</body>
</html>
